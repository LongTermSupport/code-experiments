name: java

on: [push, workflow_dispatch]

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: '21'
      - name: Install pinned tools
        run: |
          set -euo pipefail
          bin="$HOME/tools/bin"
          mkdir -p "$bin" "$HOME/tools/pmd"
          curl -fsSL -o "$HOME/tools/google-java-format.jar" \
            https://github.com/google/google-java-format/releases/download/v1.37.0/google-java-format-1.37.0-all-deps.jar
          printf '#!/usr/bin/env bash\nexec java -jar "%s" "$@"\n' "$HOME/tools/google-java-format.jar" > "$bin/google-java-format"
          chmod +x "$bin/google-java-format"
          curl -fsSL -o "$HOME/tools/pmd.zip" \
            https://github.com/pmd/pmd/releases/download/pmd_releases%2F7.28.0/pmd-dist-7.28.0-bin.zip
          unzip -q "$HOME/tools/pmd.zip" -d "$HOME/tools/pmd"
          ln -s "$HOME/tools/pmd/pmd-bin-7.28.0/bin/pmd" "$bin/pmd"
          echo "$bin" >> "$GITHUB_PATH"
      - run: bash ci/run-language.bash java
