name: fsharp

on: [push, workflow_dispatch]

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - run: dotnet tool install -g fantomas --version 8.0.8
      - run: dotnet tool install -g dotnet-fsharplint --version 0.27.0
      - run: bash ci/run-language.bash fsharp
