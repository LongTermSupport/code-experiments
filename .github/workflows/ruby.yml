name: ruby

on: [push, workflow_dispatch]

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install the pinned gems into the runner's preinstalled Ruby
        working-directory: ruby
        run: |
          ruby --version
          bundle config set --local path "$HOME/gems"
          bundle install
      - run: bash ci/run-language.bash ruby
