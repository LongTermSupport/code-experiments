name: php

on: [push, workflow_dispatch]

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.5'
          tools: composer:v2
          extensions: mbstring, intl, dom, xml, xmlwriter, simplexml, tokenizer, pcntl, posix, openssl
          coverage: none
          ini-values: memory_limit=4G
      - run: bash ci/run-language.bash php
